[build-system]
requires = ["setuptools>=64", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "curious-robot"
version = "0.1.0"
description = "From-scratch JEPA+SIGReg world model + SAC intrinsic curiosity on the MuJoCo SO-ARM101"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "torch>=2.2",            # models, SAC
    "numpy>=1.26",
    "mujoco>=3.1",           # SO-ARM101 simulation
    "einops>=0.7",           # lewm/jepa.py, lewm/module.py
    "transformers>=4.44,<4.50", # ViT-tiny encoder only; <4.50 keeps it torch-2.4 compatible (v5 needs torch>=2.5)
    "wandb>=0.16",           # metric/video logging
    "huggingface_hub>=0.24", # intermittent checkpoint upload
    "python-dotenv>=1.0",    # load WANDB_*/HF_* from .env
    "imageio>=2.34",         # rollout videos
    "imageio-ffmpeg>=0.4",
    "scikit-learn>=1.3",     # rp1/rp1/wm.py -- imported by src/train.py via src/rp1_planner.py
    "matplotlib>=3.8",       # plots (toy/plot_curiosity.py, src/plot_*.py, probes)
]

[project.optional-dependencies]
dev = ["pytest>=7.4", "ruff"]
# toy/push_t.py (gym-pusht's physics; pymunk 7 dropped the collision-handler API) + reading the demos' zarr
pusht = ["pymunk>=6.2,<7", "zarr>=2.16,<3"]

[tool.setuptools]
# editable install (`pip install -e .`) puts the repo root on sys.path so
# `lewm` / `env` / `model` / `src` import cleanly; SO101 XML+meshes stay in place.
packages = ["lewm", "env", "model", "src"]

[tool.ruff]
line-length = 100
target-version = "py310"
